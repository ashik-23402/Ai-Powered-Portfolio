spring:
  application:
    name: askaboutme
  ai:
    google:
      genai:
        api-key: REDACTED
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1536
        max-document-batch-size: 5
  datasource:
    username: myuser
    password: secret
    url: jdbc:postgresql://localhost:5432/mydatabase
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
  task:
    execution:
      thread-name-prefix: embedding-exec-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 50

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmind
  bucket-name: askaboutme



