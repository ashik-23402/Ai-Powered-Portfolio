spring:
  application:
    name: askaboutme
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-flash-latest
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 768
        max-document-batch-size: 5
        initialize-schema: true
  datasource:
    username: ${POSTGRES_USER:myuser}
    password: ${POSTGRES_PASSWORD:secret}
    url: jdbc:postgresql://localhost:5432/mydatabase
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
  task:
    execution:
      thread-name-prefix: embedding-exec-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 50

minio:
  url: http://localhost:9000
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket-name: askaboutme

app:
  security:
    username: ${APP_SECURITY_USERNAME:admin}
    password: ${APP_SECURITY_PASSWORD:change-me}
  rate-limit:
    ask:
      max-requests: 10
      window: 1m

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    disable-swagger-default-url: true
  show-actuator: false



