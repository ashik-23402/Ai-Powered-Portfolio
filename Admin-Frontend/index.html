<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AskAboutMe Admin</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ===================== Login screen ===================== -->
<main id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="brand">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a4 4 0 0 0-4 4v2a4 4 0 0 0 8 0V7a4 4 0 0 0-4-4Z"/><path d="M5 11v1a7 7 0 0 0 14 0v-1"/><path d="M12 19v3"/><path d="M9 22h6"/></svg>
      </span>
      <div>
        <h1>AskAboutMe</h1>
        <p>Admin console</p>
      </div>
    </div>

    <form id="login-form" novalidate>
      <label class="field">
        <span>Backend URL</span>
        <input type="text" id="api-base" autocomplete="off" value="http://localhost:8080" required />
      </label>
      <label class="field">
        <span>Username</span>
        <input type="text" id="username" autocomplete="username" required />
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="password" autocomplete="current-password" required />
      </label>

      <p id="login-error" class="error-text" hidden></p>

      <button type="submit" id="login-submit" class="btn btn-primary btn-block">
        <span class="btn-label">Sign in</span>
        <span class="spinner" hidden></span>
      </button>
    </form>
  </div>
</main>

<!-- ===================== Dashboard ===================== -->
<div id="dashboard" class="dashboard" hidden>
  <header class="app-header">
    <div class="brand brand-compact">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a4 4 0 0 0-4 4v2a4 4 0 0 0 8 0V7a4 4 0 0 0-4-4Z"/><path d="M5 11v1a7 7 0 0 0 14 0v-1"/><path d="M12 19v3"/><path d="M9 22h6"/></svg>
      </span>
      <span class="brand-title">AskAboutMe <em>Admin</em></span>
    </div>
    <div class="header-actions">
      <button id="refresh-btn" class="btn btn-ghost btn-icon" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v6h-6"/></svg>
      </button>
      <span id="whoami" class="whoami"></span>
      <button id="logout-btn" class="btn btn-ghost">Log out</button>
    </div>
  </header>

  <main class="container">
    <section class="upload-card" id="dropzone">
      <input type="file" id="file-input" hidden />
      <div class="upload-body">
        <span class="upload-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg>
        </span>
        <p class="upload-title">Drag &amp; drop a file, or <button type="button" id="browse-btn" class="link-btn">browse</button></p>
        <p class="upload-hint">PDF, DOCX, DOC, MD or TXT &middot; up to 25&nbsp;MB</p>
      </div>

      <div class="upload-progress-list" id="upload-progress-list"></div>
    </section>

    <section class="files-section">
      <div class="files-header">
        <h2>Files</h2>
        <input type="search" id="search-input" placeholder="Search files…" class="search-input" />
      </div>

      <div id="files-empty" class="empty-state" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4h10l6 6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M14 4v6h6"/></svg>
        <p>No files yet</p>
        <span>Upload a document above to get started.</span>
      </div>

      <div id="files-grid" class="files-grid"></div>
    </section>
  </main>
</div>

<!-- ===================== Delete confirm modal ===================== -->
<div id="confirm-modal" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <h3 id="confirm-title">Delete file?</h3>
    <p id="confirm-message"></p>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn btn-ghost">Cancel</button>
      <button id="confirm-delete" class="btn btn-danger">Delete</button>
    </div>
  </div>
</div>

<!-- ===================== Toasts ===================== -->
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
